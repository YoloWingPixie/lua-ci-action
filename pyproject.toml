[project]
name = "lua-ci-action"
version = "1.0.0"
description = "Reusable Lua code-quality checks for GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lizard==1.23.0",
    "luaparser==4.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.12.11",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
required-version = ">=0.12.5,<0.13"

